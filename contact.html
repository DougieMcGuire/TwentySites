  .stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 12%, rgba(0,0,0,0) 48%, rgba(0,0,0,.32) 100%);}

  .hand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:3;
    height:clamp(46vh, 82vh, 108vmin);
    filter:drop-shadow(0 24px 40px rgba(0,0,0,.45));pointer-events:none;user-select:none;}

  /* a contact node = round icon button + label + value, centred on the gutter point */
  .node{position:absolute;z-index:4;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:clamp(.5rem,1vw,.8rem);width:clamp(150px,20vw,240px);text-decoration:none;color:var(--ink);}
  .node.left{left:20%;}
  .node.right{left:80%;}

  .dot{width:clamp(66px,7vw,104px);height:clamp(66px,7vw,104px);border-radius:50%;
    display:grid;place-items:center;background:var(--green);
    box-shadow:0 12px 30px rgba(15,40,28,.5), inset 0 0 0 1px rgba(255,255,255,.08);
    transition:transform .24s cubic-bezier(.2,.7,.2,1),background .24s,box-shadow .24s;}
  .dot svg{width:44%;height:44%;fill:#fff;}
  .node:hover .dot,.node:focus-visible .dot{transform:translateY(-4px) scale(1.04);
    background:var(--green-br);box-shadow:0 18px 40px rgba(15,40,28,.6);}
  .node:focus-visible{outline:none;}

  .label{font-family:var(--sans);font-weight:600;letter-spacing:-.01em;line-height:1.1;
    font-size:clamp(1.05rem,1.7vw,1.5rem);color:var(--ink);}
  .value{font-family:var(--sans);font-weight:500;letter-spacing:.01em;
    font-size:clamp(.82rem,1.05vw,1.02rem);color:var(--muted);white-space:nowrap;}

  /* ---------- DESKTOP : real 3D-rotated panels facing centre ---------- */
  @media (min-width:761px){
    .node{
      width:clamp(262px,22vw,330px);
      padding:clamp(36px,2.8vw,54px) clamp(26px,2vw,42px) clamp(32px,2.4vw,46px);
      gap:clamp(1rem,1.3vw,1.5rem);
      border-radius:26px;
      background:#35604a;                                   /* flat card green */
      border:1px solid rgba(255,255,255,.10);
      box-shadow:0 42px 74px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10);
      /* per-element perspective => genuine 3D rotation, not a flat scale */
      transform:translate(-50%,-50%) perspective(1050px) rotateY(var(--ry));
      transition:transform .6s cubic-bezier(.2,.72,.2,1), box-shadow .45s, background .35s;
      backface-visibility:hidden;
    }
    .node.left{--ry:38deg;}       /* faces inward toward centre */
    .node.right{--ry:-38deg;}

    /* plain big white icons, NO circle in any state */
    .node .dot{width:auto;height:auto;background:none;box-shadow:none;border-radius:0;}
    .node .dot svg{width:clamp(64px,5.6vw,92px);height:auto;fill:#fff;}
    .node .label{color:#fff;font-size:clamp(1.25rem,1.6vw,1.6rem);}
    .node .value{color:rgba(255,255,255,.85);font-size:clamp(.9rem,1.05vw,1.05rem);}

    /* hover: rotate flat to face forward — pure rotation, no scale/stretch */
    .node:hover,.node:focus-within{
      transform:translate(-50%,-50%) perspective(1050px) rotateY(0deg);
      box-shadow:0 50px 92px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
      background:#3a6b51;
    }
    .node:hover .dot,.node:focus-within .dot{background:none;box-shadow:none;transform:none;}
  }

  /* ---------- MOBILE : keep them in the side gutters, hand stays big ---------- */
  @media (max-width:760px){
    .hand{height:clamp(60vh,72vh,80vh);}       /* bigger hand */
    .node{width:clamp(108px,40vw,180px);top:47%;gap:.4rem;}  /* down to the middle */
    .node.left{left:21%;}
    .node.right{left:79%;}
    .dot{width:clamp(52px,14vw,72px);height:clamp(52px,14vw,72px);}
    .label{font-size:clamp(.72rem,3.15vw,1.05rem);}
    .value{display:none;}                       /* hide number/email on mobile */
    .stage::after{background:radial-gradient(150% 60% at 50% 8%, rgba(0,0,0,0) 44%, rgba(0,0,0,.4) 100%);}
  }

  /* entrance */
  @keyframes rise{from{opacity:0;}to{opacity:1;}}
  @keyframes riseHand{from{opacity:0;transform:translateX(-50%) translateY(26px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  .hand{animation:riseHand 1s cubic-bezier(.2,.7,.2,1) both;}
  .node.left{animation:rise .8s .12s cubic-bezier(.2,.7,.2,1) both;}
  .node.right{animation:rise .8s .26s cubic-bezier(.2,.7,.2,1) both;}
  @media (prefers-reduced-motion:reduce){ .hand,.node{animation:none;} }
</style>
