  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}

  .scene{position:relative;width:100%;height:100svh;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}

  .toggle{position:absolute;z-index:9;top:clamp(20px,4vh,48px);left:50%;transform:translateX(-50%);
    display:flex;background:#1b1e1d;border:1px solid #33403a;border-radius:10px;overflow:hidden}
  .toggle button{appearance:none;border:0;cursor:pointer;color:var(--muted);font:600 13px/1 var(--sans);
    letter-spacing:.02em;padding:11px 22px;background:transparent;transition:background .18s,color .18s;-webkit-tap-highlight-color:transparent}
  .toggle button.on{background:var(--green);color:#fff}

  .stage{position:relative;width:100%;height:100%;perspective:1600px;transform-style:preserve-3d}
  .card{position:absolute;top:50%;left:50%;will-change:transform,opacity;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.33,.02,.2,1),opacity .5s ease,width .35s;transform-origin:center;backface-visibility:hidden}
  .frame{position:relative;width:100%;overflow:hidden;background:#0d100e;border:1px solid var(--green);border-radius:16px;
    box-shadow:0 0 0 1px rgba(0,0,0,.35),0 30px 60px -28px rgba(0,0,0,.85),0 0 34px -4px rgba(58,106,80,.75);
    transition:aspect-ratio .35s,border-radius .35s}
  .mode-mobile .frame{aspect-ratio:9/16;border-radius:30px}
  .mode-desktop .frame{aspect-ratio:16/10}

  .chrome{display:none;align-items:center;gap:8px;height:34px;padding:0 12px;background:#141816;border-bottom:1px solid #2a3630}
  .mode-desktop .chrome{display:flex}
  .chrome .d{width:9px;height:9px;border-radius:50%;background:#2a3a32}
  .chrome .u{flex:1;height:19px;margin-left:6px;border-radius:6px;background:#0e1210;border:1px solid #253029;
    display:flex;align-items:center;gap:7px;padding:0 9px;color:#bcd8c8;font:500 11px/1 var(--sans);overflow:hidden;white-space:nowrap}
  .chrome .u img{width:13px;height:13px;border-radius:3px;flex:0 0 auto;opacity:0;transition:.4s}
  .chrome .u img.on{opacity:.9}

  .view{position:relative;width:100%;aspect-ratio:inherit}
  .shot{position:absolute;inset:0;background:#0d100e center top/cover no-repeat;opacity:0;transition:opacity .45s}
  .shot.on{opacity:1}
  .spin{position:absolute;inset:0;display:grid;place-items:center;background:#0e1310;transition:opacity .35s}
  .spin.gone{opacity:0;pointer-events:none}
  .spin i{width:24px;height:24px;border:2px solid rgba(77,136,105,.3);border-top-color:var(--green-2);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .mcap{position:absolute;left:0;right:0;top:0;z-index:2;display:none;align-items:center;gap:8px;
    padding:10px 14px 22px;background:linear-gradient(180deg,rgba(8,12,10,.9),transparent)}
  .mode-mobile .card.active .mcap{display:flex}
  .mcap img{width:19px;height:19px;border-radius:5px;background:#fff;padding:2px;object-fit:contain;flex:0 0 auto;opacity:0;transition:.4s}
  .mcap img.on{opacity:1}
  .mcap span{font:600 12.5px/1 var(--sans);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .card.active .frame{cursor:zoom-in}
  .card:not(.active) .frame{cursor:pointer}
  .hint{position:absolute;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;background:rgba(12,18,14,.72);border:1px solid rgba(77,136,105,.5);
    color:#dff1e7;font:600 11px/1 var(--sans);white-space:nowrap;backdrop-filter:blur(4px)}
  .card.active .hint{display:flex}
  .hint svg{width:12px;height:12px;fill:currentColor}

  .arrow{position:absolute;z-index:8;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);background:#1b1e1d;border:1px solid #33403a;transition:.18s;-webkit-tap-highlight-color:transparent}
  .arrow:hover{background:var(--green);border-color:var(--green)}
  .arrow svg{width:42%;height:42%;fill:currentColor}
  .arrow.prev{left:clamp(14px,4vw,58px)}.arrow.next{right:clamp(14px,4vw,58px)}

  .dots{position:absolute;z-index:8;left:0;right:0;bottom:clamp(20px,4vh,38px);display:flex;gap:8px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(210,220,215,.3);cursor:pointer;transition:.28s}
  .dots i.on{background:var(--green-2);width:22px;border-radius:4px}

  .lb{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
  .lb.open{display:flex}
  .lb-back{position:absolute;inset:0;background:rgba(6,9,7,.72);backdrop-filter:blur(6px);animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb-box{position:relative;z-index:1;background:#0d100e;border:1px solid var(--green);overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 40px -6px rgba(58,106,80,.7);display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.3,.7,.2,1)}
  @keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
  .lb.m .lb-box{width:min(392px,94vw);height:min(94vh,820px);border-radius:26px}
  .lb.d .lb-box{width:min(1200px,94vw);height:min(88vh,820px);border-radius:14px}
  .lb-bar{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;background:#141816;border-bottom:1px solid #2a3630;flex:0 0 auto}
  .lb-bar img{width:16px;height:16px;border-radius:4px}
  .lb-bar b{font:600 13px/1 var(--sans);color:#eafff4}
  .lb-bar .sp{flex:1}
  .lb-bar a,.lb-bar button{appearance:none;border:1px solid #2f4a3c;background:#12201a;color:#cfeadd;cursor:pointer;
    font:600 12px/1 var(--sans);padding:8px 12px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .lb-bar a:hover,.lb-bar button:hover{background:var(--green);color:#fff;border-color:var(--green)}
  .lb-bar svg{width:13px;height:13px;fill:currentColor}
  .lb-frame{position:relative;flex:1;background:#fff}
  .lb-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .lb-note{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0e1310;color:#9fb6aa;font:500 13px/1.5 var(--sans)}
  .lb-note.show{display:flex}
  .lb-note a{color:#8fe0b6}

  @media (max-width:820px){.arrow.prev{left:8px}.arrow.next{right:8px}}
</style>

<body>
  <main class="scene mode-mobile" id="scene">
    <div class="toggle" id="toggle">
      <button class="on" data-mode="mobile">Mobile</button>
      <button data-mode="desktop">Desktop</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="arrow prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></div>
    <div class="arrow next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4L13.2 12z"/></svg></div>
    <div class="dots" id="dots"></div>
  </main>

  <div class="lb" id="lb">
    <div class="lb-back" id="lbBack"></div>
    <div class="lb-box">
      <div class="lb-bar"><img id="lbFav" alt=""><b id="lbDom"></b><span class="sp"></span>
        <a id="lbOpen" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 3v2h3.6l-9.3 9.3 1.4 1.4L19 6.4V10h2V3zM5 5h5V3H3v18h18v-7h-2v5H5z"/></svg>Open</a>
        <button id="lbClose"><svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>Close</button>
      </div>
      <div class="lb-frame">
        <iframe id="lbFrame" title="Live site" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
        <div class="lb-note" id="lbNote">This site blocks being embedded.<br><a id="lbNoteLink" target="_blank" rel="noopener">Open it in a new tab →</a></div>
      </div>
    </div>
  </div>

<script>
(function(){
  const FALLBACK=["figma.com","apple.com","spotify.com","airbnb.com","stripe.com","notion.so","nike.com","github.com"];
  const scene=document.getElementById('scene'),stage=document.getElementById('stage');
  const dotsWrap=document.getElementById('dots'),toggle=document.getElementById('toggle');
  const lb=document.getElementById('lb'),lbFrame=document.getElementById('lbFrame'),lbNote=document.getElementById('lbNote');
  const lbDom=document.getElementById('lbDom'),lbFav=document.getElementById('lbFav'),lbOpen=document.getElementById('lbOpen'),lbNoteLink=document.getElementById('lbNoteLink');
  let sites=[],cards=[],rotation=0,active=0,mode='mobile',timer=null;const DUR=5000;
  const cache={},D2R=Math.PI/180;
  const domain=s=>s.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  const favURL=d=>`https://www.google.com/s2/favicons?domain=${d}&sz=128`;
  const thumb=(d,m)=> m?`https://image.thum.io/get/viewport/390x1400/width/800/https://${d}`:`https://image.thum.io/get/width/1280/crop/800/https://${d}`;
  const mshots=(d,w)=>`https://s.wordpress.com/mshots/v1/${encodeURIComponent('https://'+d)}?w=${w}`;
  function tint(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(155deg,hsl(${h} 18% 17%),hsl(${(h+22)%360} 16% 10%))`;}
  function chain(urls,fb,cb){let k=0;(function n(){if(k>=urls.length)return cb(fb,false);
    const u=urls[k++],im=new Image();im.onload=()=>cb(`url("${u}")`,true);im.onerror=n;im.src=u;})();}

  function cardWidth(){const vw=window.innerWidth,vh=window.innerHeight;
    if(mode==='mobile'){return Math.max(140,Math.min(vh*0.56*9/16, vw*0.30));}
    return Math.max(300,Math.min(vw*0.34, vh*0.60*16/10));}

  function loadShot(c){const d=c.domain,key=mode+'|'+d;
    if(cache[key]){c.shot.style.backgroundImage=cache[key];c.shot.classList.add('on');c.spin.classList.add('gone');return;}
    if(c._loading===key)return; c._loading=key;
    c.shot.classList.remove('on');c.spin.classList.remove('gone');
    chain([thumb(d,mode==='mobile'),mshots(d,mode==='mobile'?600:1280)],tint(d),(bg)=>{
      cache[key]=bg;if(c._loading===key)c._loading=null;
      c.shot.style.backgroundImage=bg;c.shot.classList.add('on');c.spin.classList.add('gone');});}

  const step=()=>360/sites.length;

  function place(){
    const w=cardWidth(),N=sites.length,st=step();
    const R = mode==='mobile'? w*1.42 : w*1.36;   // ring radius (wide enough that neighbours stay behind the front plane => no phasing)
    cards.forEach((c,i)=>{
      const angDeg = rotation + i*st;
      const a=angDeg*D2R, cs=Math.cos(a), sn=Math.sin(a);
      const tx=sn*R, tz=(cs-1)*R, sc=0.55+0.45*cs;
      let op = cs>0.86?1 : cs>0.42?0.5 : 0;
      c.el.style.width=w+'px';
      c.el.style.zIndex=Math.round((cs+1)*100);
      c.el.style.opacity=op;
      c.el.style.pointerEvents=op>0?'auto':'none';
      c.el.classList.toggle('active',op>0.9);
      c.el.style.transform=`translate(-50%,-50%) translateX(${tx}px) translateZ(${tz}px) rotateY(${angDeg}deg) scale(${sc})`;
      if(cs>0.3)loadShot(c);
    });
    active=((Math.round(-rotation/st)%N)+N)%N;
    [...dotsWrap.children].forEach((n,k)=>n.classList.toggle('on',k===active));
  }

  function go(dir){rotation-=dir*step();place();restart();}         // spin around the pole; continuous, spam-safe
  function to(i){let d=((i-active)%sites.length+sites.length)%sites.length;if(d>sites.length/2)d-=sites.length;rotation-=d*step();place();restart();}
  function restart(){clearInterval(timer);if(!lb.classList.contains('open'))timer=setInterval(()=>go(1),DUR);}
  function setMode(m){if(m===mode)return;mode=m;
    scene.classList.toggle('mode-mobile',m==='mobile');scene.classList.toggle('mode-desktop',m==='desktop');
    [...toggle.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.mode===m));place();}
  toggle.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode);});

  function openLB(d){clearInterval(timer);
    lb.classList.remove('m','d');lb.classList.add(mode==='mobile'?'m':'d','open');
    lbDom.textContent=d;lbFav.src=favURL(d);lbOpen.href='https://'+d;lbNoteLink.href='https://'+d;lbNote.classList.remove('show');
    let painted=false;lbFrame.onload=()=>{painted=true;};lbFrame.src='https://'+d;
    setTimeout(()=>{if(!painted)lbNote.classList.add('show');},3500);}
  function closeLB(){lb.classList.remove('open');lbFrame.src='about:blank';restart();}
  document.getElementById('lbBack').onclick=closeLB;
  document.getElementById('lbClose').onclick=closeLB;

  function build(){
    stage.innerHTML='';cards=[];dotsWrap.innerHTML='';rotation=0;
    sites.forEach((d,idx)=>{
      const el=document.createElement('div');el.className='card';
      el.innerHTML=`<div class="frame">
        <div class="chrome"><span class="d"></span><span class="d"></span><span class="d"></span>
          <span class="u"><img alt=""><span>${d}</span></span></div>
        <div class="view"><div class="mcap"><img alt=""><span>${d}</span></div>
          <div class="shot"></div><div class="spin"><i></i></div>
          <div class="hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H15zM9 21H3v-6h2v2.6l4.3-4.3 1.4 1.4L6.4 19H9z"/></svg>Tap to open live</div>
        </div></div>`;
      const c={el,domain:d,shot:el.querySelector('.shot'),spin:el.querySelector('.spin'),_loading:null};
      el.querySelectorAll('.chrome img,.mcap img').forEach(im=>{const f=favURL(d),t=new Image();t.onload=()=>{im.src=f;im.classList.add('on');};t.src=f;});
      el.querySelector('.frame').addEventListener('click',()=>{ idx===active?openLB(d):to(idx); });
      stage.appendChild(el);cards.push(c);
      const dot=document.createElement('i');dot.onclick=()=>to(idx);dotsWrap.appendChild(dot);
    });
    place();restart();
  }

  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&lb.classList.contains('open'))return closeLB();
    if(lb.classList.contains('open'))return;
    if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
  let sx=null;scene.addEventListener('pointerdown',e=>sx=e.clientX);
  scene.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1);sx=null;});
  // debounced resize -> re-layout only (cache prevents any re-fetch on zoom)
  let rt=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(place,120);});

  fetch('clientsites.txt').then(r=>{if(!r.ok)throw 0;return r.text()})
    .then(t=>{const l=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')).map(domain);sites=l.length?l:FALLBACK;build();})
    .catch(()=>{sites=FALLBACK;build();});
})();
</script>
</body>
</html>
