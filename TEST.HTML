<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Selected work — Twenty Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b0a;
    --bg2:#0c1210;
    --ink:#eef3ef;
    --muted:#8fa79b;
    --line:rgba(120,180,150,.14);
    --emerald:#1c5c43;         /* deep luxury green */
    --emerald-soft:#3f8f6b;
    --glow:rgba(28,92,67,.55);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
    --sx:50%; --sy:25.9%; --sw:24.4%; --sh:43.1%;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(140% 120% at 50% -10%, #0f1a15 0%, var(--bg2) 34%, var(--bg) 72%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overflow:hidden;user-select:none;
  }
  /* fine grain so the dark plane doesn't read as flat/AI */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 34%, transparent 46%, rgba(0,0,0,.55) 100%);}

  .scene{position:relative;width:100%;height:100svh;min-height:100vh;overflow:hidden;isolation:isolate}

  /* ---- segmented view toggle (replaces the old title bar) ---- */
  .toggle{position:absolute;z-index:8;top:clamp(22px,4.4vh,52px);left:50%;transform:translateX(-50%);
    display:flex;gap:2px;padding:4px;border-radius:999px;
    background:rgba(10,16,13,.66);border:1px solid var(--line);backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .toggle button{appearance:none;border:0;cursor:pointer;color:var(--muted);
    font:500 13px/1 var(--sans);letter-spacing:.02em;padding:9px 18px;border-radius:999px;
    background:transparent;transition:color .25s;-webkit-tap-highlight-color:transparent}
  .toggle button.on{color:#eafff4}
  .toggle .pill{position:absolute;z-index:-1;top:4px;bottom:4px;border-radius:999px;
    background:linear-gradient(180deg,#227052,var(--emerald));
    box-shadow:0 4px 16px var(--glow),inset 0 1px 0 rgba(255,255,255,.14);
    transition:left .32s cubic-bezier(.6,.05,.2,1),width .32s cubic-bezier(.6,.05,.2,1)}

  /* ---- the projected preview (the hero — full, uncropped) ---- */
  .stage{position:absolute;z-index:4;left:50%;top:clamp(88px,15vh,150px);transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;transition:width .35s cubic-bezier(.6,.05,.2,1)}
  .stage.mobile{width:clamp(210px,20vw,262px)}
  .stage.desktop{width:min(78vw,760px)}

  .win{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#0c110f;
    border:1px solid rgba(150,210,180,.16);
    box-shadow:
      0 0 0 1px rgba(0,0,0,.4),
      0 30px 70px -28px rgba(0,0,0,.85),
      0 0 60px -14px var(--glow);
    transition:aspect-ratio .35s}
  .stage.mobile .win{aspect-ratio:9/17.5;border-radius:26px}
  .stage.desktop .win{aspect-ratio:16/10}

  /* browser chrome — only in desktop */
  .chrome{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
    background:linear-gradient(180deg,#111a16,#0d1512);border-bottom:1px solid rgba(150,210,180,.1)}
  .stage.mobile .chrome{display:none}
  .chrome .dot{width:10px;height:10px;border-radius:50%;background:#26332c}
  .chrome .bar{flex:1;height:18px;margin-left:6px;border-radius:6px;
    background:rgba(255,255,255,.03);border:1px solid rgba(150,210,180,.08);
    display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--muted);
    font:500 11px/1 var(--sans);letter-spacing:.02em;overflow:hidden;white-space:nowrap}
  .chrome .bar img{width:13px;height:13px;border-radius:3px;opacity:0;transition:opacity .4s;flex:0 0 auto}
  .chrome .bar img.on{opacity:.9}

  .shot{position:absolute;left:0;right:0;top:0;bottom:0;background:#fff;
    background-repeat:no-repeat;background-position:top center;background-size:100% auto;opacity:0;
    transition:opacity .5s ease}
  .stage.desktop .shot{top:34px}
  .shot.on{opacity:1}

  /* mobile phone-frame caption */
  .mcap{position:absolute;z-index:3;left:0;right:0;top:0;display:none;align-items:center;gap:8px;
    padding:10px 14px 22px;
    background:linear-gradient(180deg,rgba(6,12,9,.9),rgba(6,12,9,0))}
  .stage.mobile .mcap{display:flex}
  .mcap img{width:20px;height:20px;border-radius:5px;background:#fff;padding:2px;object-fit:contain;opacity:0;transition:.4s;flex:0 0 auto}
  .mcap img.on{opacity:1}
  .mcap span{font:600 13px/1 var(--sans);letter-spacing:.01em;color:#eafff4;
    text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* faint connective light from phone up to preview — subtle, not a beam */
  .link{position:absolute;z-index:3;left:50%;transform:translateX(-50%);
    bottom:calc(3vh + 46%);width:min(30vw,300px);height:26vh;pointer-events:none;opacity:.5;
    background:radial-gradient(60% 100% at 50% 100%, var(--glow), transparent 72%);
    filter:blur(14px)}

  /* ---- hand + phone (source) ---- */
  .device{position:absolute;z-index:5;left:50%;bottom:-3vh;transform:translateX(-50%);
    width:clamp(280px,29vw,410px)}
  .device img.hand{display:block;width:100%;height:auto;position:relative;z-index:2;
    filter:drop-shadow(0 30px 46px rgba(0,0,0,.6))}
  .screen{position:absolute;z-index:1;left:var(--sx);top:var(--sy);
    width:var(--sw);height:var(--sh);transform:translate(-50%,-50%);
    border-radius:9%/4.5%;overflow:hidden;background:#0a0e0c}
  .screen .pshot{position:absolute;inset:0;background:#fff;background-repeat:no-repeat;
    background-position:top center;background-size:100% auto;opacity:0;transition:opacity .5s;
    filter:saturate(.96)}
  .screen .pshot.on{opacity:1}
  .screen::after{content:"";position:absolute;inset:0;
    background:linear-gradient(150deg,rgba(60,143,107,.16),rgba(0,0,0,.28));mix-blend-mode:screen}

  /* ---- controls ---- */
  .arrow{position:absolute;z-index:7;top:clamp(88px,15vh,150px);
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    color:var(--ink);background:rgba(12,18,15,.55);border:1px solid var(--line);
    backdrop-filter:blur(6px);transition:.2s;-webkit-tap-highlight-color:transparent}
  .arrow:hover{background:rgba(28,92,67,.35);border-color:rgba(63,143,107,.5)}
  .arrow svg{width:40%;height:40%;fill:currentColor}
  .arrow.prev{left:clamp(14px,4vw,54px)} .arrow.next{right:clamp(14px,4vw,54px)}

  .dots{position:absolute;z-index:7;left:0;right:0;bottom:clamp(20px,4vh,38px);
    display:flex;gap:8px;justify-content:center}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(150,190,170,.28);cursor:pointer;transition:.28s}
  .dots i.on{background:var(--emerald-soft);width:22px;border-radius:4px}

  @media (max-width:820px){
    .stage.desktop{width:92vw}
    .device{width:clamp(230px,74vw,330px);bottom:-5vh}
    .arrow.prev{left:8px} .arrow.next{right:8px}
    .stage,.arrow{top:96px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="arrow prev" id="prev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></div>
    <div class="arrow next" id="next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4L13.2 12z"/></svg></div>
    <div class="dots" id="dots"></div>
  </main>

<script>
(function(){
  const FALLBACK=["nike.com","apple.com","spotify.com","airbnb.com","stripe.com","figma.com","notion.so","github.com"];
  const shot=document.getElementById('shot');
  const pshot=document.getElementById('pshot');
  const cfav=document.getElementById('cfav'), curl=document.getElementById('curl');
  const mfav=document.getElementById('mfav'), mname=document.getElementById('mname');
  const stage=document.getElementById('stage');
  const dotsWrap=document.getElementById('dots');
  const toggle=document.getElementById('toggle'), pill=document.getElementById('pill');
  let sites=[], i=0, timer=null, mode='mobile';
  const DUR=4200;

  const domain=s=>s.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  const shotURL=(d,w)=>`https://s.wordpress.com/mshots/v1/${encodeURIComponent('https://'+d)}?w=${w}`;
  const favURL=d=>`https://www.google.com/s2/favicons?domain=${d}&sz=128`;
  function tint(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))%360;
    return `linear-gradient(155deg,hsl(${h} 22% 20%),hsl(${(h+24)%360} 20% 11%))`;}
  function preload(u,ok,fail){const im=new Image();im.onload=()=>ok(u);im.onerror=fail;im.src=u;}

  function paintShot(){
    const d=sites[i];
    const w = mode==='desktop' ? 1280 : 480;
    const url = shotURL(d,w);
    shot.classList.remove('on');
    preload(url,u=>{shot.style.backgroundImage=`url("${u}")`;shot.classList.add('on');},
                 ()=>{shot.style.backgroundImage=tint(d);shot.classList.add('on');});
  }

  function show(idx){
    i=(idx+sites.length)%sites.length;
    const d=sites[i];
    curl.textContent=d; mname.textContent=d;
    [cfav,mfav].forEach(el=>{el.classList.remove('on');
      const f=favURL(d), im=new Image();
      im.onload=()=>{el.src=f;el.classList.add('on');}; im.onerror=()=>el.classList.remove('on'); im.src=f;});
    paintShot();
    // phone screen always mobile view
    pshot.classList.remove('on');
    preload(shotURL(d,480),u=>{pshot.style.backgroundImage=`url("${u}")`;pshot.classList.add('on');},
                            ()=>{pshot.style.backgroundImage=tint(d);pshot.classList.add('on');});
    [...dotsWrap.children].forEach((n,k)=>n.classList.toggle('on',k===i));
  }
  function go(step){show(i+step);restart()}
  function restart(){clearInterval(timer);timer=setInterval(()=>show(i+1),DUR)}

  function setMode(m){
    mode=m;
    stage.classList.toggle('mobile',m==='mobile');
    stage.classList.toggle('desktop',m==='desktop');
    [...toggle.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
    movePill(); paintShot();
  }
  function movePill(){
    const btn=toggle.querySelector('button.on');
    pill.style.left=btn.offsetLeft+'px'; pill.style.width=btn.offsetWidth+'px';
  }
  toggle.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode)});

  function build(){
    dotsWrap.innerHTML='';
    sites.forEach((_,k)=>{const b=document.createElement('i');
      b.onclick=()=>{show(k);restart()};dotsWrap.appendChild(b)});
    movePill(); show(0); restart();
  }

  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
  let sx=null;const sc=document.querySelector('.scene');
  sc.addEventListener('pointerdown',e=>sx=e.clientX);
  sc.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>45)go(dx<0?1:-1);sx=null});
  window.addEventListener('resize',movePill);

  fetch('clientsites.txt').then(r=>{if(!r.ok)throw 0;return r.text()})
    .then(t=>{const l=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')).map(domain);
      sites=l.length?l:FALLBACK;build()})
    .catch(()=>{sites=FALLBACK;build()});
})();
</script>
</body>
</html>
