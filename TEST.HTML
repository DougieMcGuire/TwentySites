    overflow:hidden;background:#0a0e11;}
  .screen .shot{position:absolute;inset:-10%;background-size:cover;background-position:center;
    filter:blur(10px) saturate(1.2) brightness(1.05);opacity:0;transition:opacity .6s ease;}
  .screen .shot.on{opacity:.9;}
  .screen::after{content:"";position:absolute;inset:0;
    background:linear-gradient(150deg, rgba(99,242,201,.06), rgba(0,0,0,.34));mix-blend-mode:screen;}

  /* hologram rises from the phone screen (anchored to the screen point on the device) */
  .holo{position:absolute;z-index:4;left:53.7%;bottom:80.7%;transform:translateX(-50%);
    width:clamp(230px,23vw,320px);height:clamp(300px,46vh,470px);pointer-events:none;}
  .beam{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:92%;height:100%;filter:blur(6px);opacity:.85;animation:flick 4s infinite;
    background:linear-gradient(to top, rgba(99,242,201,.5), rgba(99,242,201,.12) 55%, rgba(99,242,201,0));
    clip-path:polygon(40% 100%, 60% 100%, 100% 0, 0 0);}
  .panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    height:96%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(120,255,220,.55), 0 0 34px rgba(99,242,201,.42), inset 0 0 40px rgba(99,242,201,.16);
    animation:float 5.5s ease-in-out infinite, flick 5s infinite;}
  .panel .pshot{position:absolute;inset:0;background-size:cover;background-position:top center;
    filter:blur(2px) saturate(1.15) brightness(1.03);opacity:0;transition:opacity .55s ease;}
  .panel .pshot.on{opacity:.96;}
  .panel::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(160deg, rgba(99,242,201,.26), rgba(60,180,255,.12) 55%, rgba(99,242,201,.28));
    mix-blend-mode:screen;}
  .panel::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.45;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.10) 0 1px, rgba(0,0,0,0) 1px 4px);}
  .cap{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:.5rem;
    padding:.55rem .6rem;background:linear-gradient(to bottom, rgba(3,18,14,.86), rgba(3,18,14,0));}
  .cap img{width:clamp(20px,1.7vw,26px);height:clamp(20px,1.7vw,26px);border-radius:6px;
    background:rgba(255,255,255,.92);padding:2px;object-fit:contain;opacity:0;transition:opacity .5s ease;flex:0 0 auto;}
  .cap img.on{opacity:1;}
  .cap span{font-weight:700;letter-spacing:.01em;font-size:clamp(.8rem,1vw,1rem);color:#eafff8;
    text-shadow:0 0 10px rgba(99,242,201,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  @keyframes float{0%,100%{translate:0 0;}50%{translate:0 -9px;}}
  @keyframes flick{0%,100%{opacity:.82;}47%{opacity:.78;}50%{opacity:.6;}53%{opacity:.8;}}

  .arrow{position:absolute;z-index:7;top:50%;transform:translateY(-50%);
    width:clamp(44px,3.4vw,56px);height:clamp(44px,3.4vw,56px);border-radius:50%;
    display:grid;place-items:center;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--ink);
    transition:background .2s,border-color .2s;-webkit-tap-highlight-color:transparent;}
  .arrow:hover{background:rgba(99,242,201,.18);border-color:rgba(99,242,201,.5);}
  .arrow.prev{left:clamp(14px,3vw,44px);} .arrow.next{right:clamp(14px,3vw,44px);}
  .arrow svg{width:42%;height:42%;fill:currentColor;}
  .dots{position:absolute;z-index:7;left:0;right:0;bottom:clamp(16px,3.4vh,34px);
    display:flex;gap:.5rem;justify-content:center;}
  .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.25s;}
  .dots i.on{background:var(--holo);width:22px;border-radius:5px;box-shadow:0 0 10px rgba(99,242,201,.7);}

  @media (max-width:760px){
    .device{width:clamp(250px,72vw,340px);bottom:-5vh;}
    .holo{width:clamp(230px,80vw,330px);height:clamp(300px,44vh,460px);}
    .arrow.prev{left:8px;} .arrow.next{right:8px;}
  }
  @media (prefers-reduced-motion:reduce){ .beam,.panel,.cap{animation:none;} }

</style>

    <div class="holo">
      <div class="beam"></div>
      <div class="panel">
        <div class="pshot" id="pshot"></div>
        <div class="cap"><img id="logo" alt=""><span id="siteName">nike.com</span></div>
      </div>
    </div>

    </div>

    <div class="arrow prev" id="prev" aria-label="Previous site">
      <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></div>
    <div class="arrow next" id="next" aria-label="Next site">
      <svg viewBox="0 0 24 24"><path d="M8.6 7.4 10 6l6 6-6 6-1.4-1.4L13.2 12z"/></svg></div>
    <div class="dots" id="dots"></div>
  </main>

<script>
(function(){
  const FALLBACK=["nike.com","apple.com","spotify.com","airbnb.com","stripe.com","figma.com","notion.so","github.com"];
  const shot=document.getElementById('shot');
  const pshot=document.getElementById('pshot');
  const logo=document.getElementById('logo');
  const nameEl=document.getElementById('siteName');
  const dotsWrap=document.getElementById('dots');
  let sites=[], i=0, timer=null;
  const DUR=3500;

  const domain=s=>s.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  const shotURL=(d,w)=>`https://s.wordpress.com/mshots/v1/${encodeURIComponent('https://'+d)}?w=${w}`;
  const favURL =d=>`https://www.google.com/s2/favicons?domain=${d}&sz=128`;
  // deterministic fallback colour if a screenshot can't load
  function tint(d){let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))%360;
    return `linear-gradient(150deg,hsl(${h} 34% 26%),hsl(${(h+30)%360} 30% 14%))`;}

  function preload(url,ok,fail){const im=new Image();im.onload=()=>ok(url);im.onerror=fail;im.src=url;}

  function show(idx){
    i=(idx+sites.length)%sites.length;
    const d=sites[i];
    nameEl.textContent=d;
    // logo
    logo.classList.remove('on');
    const fav=favURL(d); const fi=new Image();
    fi.onload=()=>{logo.src=fav;logo.classList.add('on');};
    fi.onerror=()=>{logo.classList.remove('on');}; fi.src=fav;
    // screenshots (blurry) with graceful fallback to a brand-ish gradient
    const big=shotURL(d,700), small=shotURL(d,420);
    shot.classList.remove('on'); pshot.classList.remove('on');
    preload(small,u=>{shot.style.backgroundImage=`url("${u}")`;shot.classList.add('on');},
                     ()=>{shot.style.backgroundImage=tint(d);shot.classList.add('on');});
    preload(big,  u=>{pshot.style.backgroundImage=`url("${u}")`;pshot.classList.add('on');},
                     ()=>{pshot.style.backgroundImage=tint(d);pshot.classList.add('on');});
    // dots
    [...dotsWrap.children].forEach((n,k)=>n.classList.toggle('on',k===i));
  }
  function go(step){show(i+step);restart();}
  function restart(){clearInterval(timer);timer=setInterval(()=>show(i+1),DUR);}

  function build(){
    dotsWrap.innerHTML='';
    sites.forEach((_,k)=>{const b=document.createElement('i');
      b.onclick=()=>{show(k);restart();};dotsWrap.appendChild(b);});
    show(0);restart();
  }

  // controls
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
  // swipe
  let sx=null;const sc=document.querySelector('.scene');
  sc.addEventListener('pointerdown',e=>sx=e.clientX);
  sc.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;
    if(Math.abs(dx)>45)go(dx<0?1:-1);sx=null;});

  // load clientsites.txt, else fallback
  fetch('clientsites.txt').then(r=>{if(!r.ok)throw 0;return r.text();})
    .then(t=>{const list=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('#')).map(domain);
      sites=list.length?list:FALLBACK;build();})
    .catch(()=>{sites=FALLBACK;build();});
})();
</script>
